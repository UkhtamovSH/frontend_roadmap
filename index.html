<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Frontend Roadmap — Junior → Senior</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF0F4; --surface:#FFFFFF; --ink:#14213D; --muted:#5B6478; --line:#D5DAE3;
  --j:#1F8A5B; --m:#C27C00; --s:#6D43CF; --accent:var(--j);
  --check-bg:#E6EAF0;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#101626; --surface:#18203A; --ink:#E7EBF3; --muted:#98A2B8; --line:#2A3555;
    --j:#3CC48A; --m:#F0A92E; --s:#A383F5; --check-bg:#232D4A; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#101626; --surface:#18203A; --ink:#E7EBF3; --muted:#98A2B8; --line:#2A3555;
  --j:#3CC48A; --m:#F0A92E; --s:#A383F5; --check-bg:#232D4A; color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 80px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Manrope,system-ui,-apple-system,"Segoe UI",sans-serif}
body[data-level="middle"]{--accent:var(--m)}
body[data-level="senior"]{--accent:var(--s)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
h1,h2,h3{font-family:Unbounded,Manrope,system-ui,sans-serif;font-weight:700;margin:0;line-height:1.15}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:4px}

.wrap{max-width:1180px;margin:0 auto;padding:0 20px}

/* Hero: the ladder */
.hero{padding:40px 0 28px}
.hero h1{font-size:clamp(28px,5vw,48px);letter-spacing:-.02em;max-width:16ch}
.hero p{color:var(--muted);max-width:60ch;margin:12px 0 28px}
.ladder{display:grid;gap:10px}
.rung{display:grid;grid-template-columns:minmax(130px,200px) 1fr auto;align-items:center;gap:16px;
  background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 18px;cursor:pointer;text-align:left;width:100%;
  border-left:8px solid var(--c)}
.rung[aria-current="true"]{box-shadow:0 0 0 2px var(--c) inset}
.rung .name{font-family:Unbounded,sans-serif;font-weight:500;font-size:15px}
.rung .sub{display:block;color:var(--muted);font-size:13px;font-family:Manrope,sans-serif}
.bar{height:14px;background:var(--check-bg);border-radius:7px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--c);border-radius:7px;transition:width .4s ease}
.rung .pct{font-family:Unbounded,sans-serif;font-size:20px;min-width:4ch;text-align:right;color:var(--c)}
.rung:nth-child(1){--c:var(--j);margin-left:0}
.rung:nth-child(2){--c:var(--m);margin-left:clamp(0px,4vw,48px)}
.rung:nth-child(3){--c:var(--s);margin-left:clamp(0px,8vw,96px)}
.rung:nth-child(2),.rung:nth-child(3){width:auto}

/* Toolbar */
.toolbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:12px 0;border-bottom:1px solid var(--line)}
.toolbar .wrap{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.search{flex:1 1 240px;min-width:0;padding:10px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.btn{padding:9px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer;white-space:nowrap}
.btn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.btn:hover{border-color:var(--accent)}

/* Layout */
.layout{display:grid;grid-template-columns:240px 1fr;gap:28px;padding:28px 0 60px}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);align-self:start;max-height:calc(100vh - 100px);overflow:auto}
.side a{display:flex;justify-content:space-between;gap:8px;padding:7px 10px;border-radius:8px;color:var(--ink);text-decoration:none;font-size:14px}
.side a:hover{background:var(--surface)}
.side a small{color:var(--muted);font-variant-numeric:tabular-nums}
.side a.full small{color:var(--accent);font-weight:700}
@media (max-width:820px){
  .layout{grid-template-columns:1fr}
  .side{position:static;max-height:none;display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
  .side a{flex:0 0 auto;background:var(--surface);border:1px solid var(--line)}
  .rung{grid-template-columns:1fr auto}
  .rung .bar{grid-column:1/-1;grid-row:2}
  .rung:nth-child(n){margin-left:0}
}

.cat{margin-bottom:40px}
.cat-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;border-bottom:3px solid var(--accent);padding-bottom:8px;margin-bottom:14px}
.cat-head h2{font-size:clamp(20px,3vw,26px)}
.cat-head span{color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}

details.topic{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:10px}
details.topic summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:14px 16px}
details.topic summary::-webkit-details-marker{display:none}
.t-title{font-weight:700}
.t-title::before{content:"+";display:inline-block;width:1.2em;color:var(--accent);font-weight:700}
details[open] .t-title::before{content:"−"}
.t-meta{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.mini{width:70px;height:6px;background:var(--check-bg);border-radius:3px;overflow:hidden}
.mini i{display:block;height:100%;background:var(--accent);width:0}
details.topic.done{border-color:var(--accent)}
details.topic.done .t-title{color:var(--accent)}

.items{list-style:none;margin:0;padding:0 16px 14px;display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:4px 16px}
.items label{display:flex;gap:10px;align-items:flex-start;padding:5px 6px;border-radius:6px;cursor:pointer;font-size:15px}
.items label:hover{background:var(--check-bg)}
.items input{appearance:none;flex:0 0 18px;width:18px;height:18px;margin-top:3px;border:2px solid var(--muted);border-radius:5px;display:grid;place-items:center;cursor:pointer}
.items input:checked{background:var(--accent);border-color:var(--accent)}
.items input:checked::after{content:"";width:9px;height:5px;border:2px solid #fff;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.items input:checked + span{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--accent)}
.t-actions{padding:0 16px 14px}
.t-actions button{font-size:13px;background:none;border:0;color:var(--accent);cursor:pointer;padding:4px 0;font-weight:700}
mark{background:color-mix(in srgb,var(--accent) 30%,transparent);color:inherit;border-radius:3px}

.projects{background:var(--surface);border:2px dashed var(--accent);border-radius:14px;padding:20px}
.projects h2{font-size:22px;margin-bottom:4px}
.projects p{margin:0 0 14px;color:var(--muted)}
.projects ol{margin:0;padding-left:0;list-style:none;counter-reset:p}
.projects li{counter-increment:p}
.projects label{display:flex;gap:12px;align-items:center;padding:8px 6px;border-radius:8px;cursor:pointer}
.projects label:hover{background:var(--check-bg)}
.projects label::before{content:counter(p);font-family:Unbounded,sans-serif;font-size:13px;width:28px;height:28px;flex:0 0 28px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--accent);color:var(--accent)}
.projects input{position:absolute;opacity:0;pointer-events:none}
.projects label:has(input:checked)::before{background:var(--accent);color:#fff;content:"✓"}
.projects label:has(input:checked) span{text-decoration:line-through;color:var(--muted)}
.projects label:has(input:focus-visible){outline:3px solid var(--accent)}

.empty{padding:40px 0;color:var(--muted)}
footer{border-top:1px solid var(--line);padding:20px 0 40px;color:var(--muted);font-size:14px}
footer .wrap{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body data-level="junior">

<header class="hero wrap">
  <h1>Frontend dasturchi yo‘l xaritasi</h1>
  <p>Juniordan Seniorgacha bo‘lgan barcha mavzular. O‘rgangan bandingizni belgilang — progress shu brauzerda saqlanadi.</p>
  <div class="ladder" id="ladder"></div>
</header>

<div class="toolbar">
  <div class="wrap">
    <input class="search" id="q" type="search" placeholder="Mavzu qidirish: masalan, useEffect, CORS, Grid…" aria-label="Mavzu qidirish">
    <button class="btn" id="onlyLeft" aria-pressed="false">Faqat qolganlar</button>
    <button class="btn" id="toggleAll">Hammasini ochish</button>
    <button class="btn" id="theme" aria-label="Rejimni almashtirish">Rejim</button>
  </div>
</div>

<div class="wrap layout">
  <nav class="side" id="side" aria-label="Bo‘limlar"></nav>
  <main id="main"></main>
</div>

<footer>
  <div class="wrap">
    <span id="totalStat"></span>
    <button class="btn" id="reset">Joriy darajani tozalash</button>
  </div>
</footer>

<script>
(function(){
  // ---------- Parse data ----------
  const levels = [];
  let L = null, C = null;
  document.getElementById('data').textContent.split('\n').forEach(raw => {
    const line = raw.trim(); if (!line) return;
    if (line[0] === '@') {
      const [id, title, sub] = line.slice(1).split('|');
      L = { id, title, sub, cats: [], projects: [] }; levels.push(L);
    } else if (line[0] === '#') {
      C = { name: line.slice(1).trim(), topics: [] }; L.cats.push(C);
    } else if (line[0] === '*') {
      L.projects.push(line.slice(1).trim());
    } else {
      const i = line.indexOf(': ');
      C.topics.push({ name: line.slice(0, i), items: line.slice(i + 2).split('|') });
    }
  });
  levels.forEach(l => l.cats.forEach((c, ci) => {
    c.id = l.id + '-c' + ci;
    c.topics.forEach((t, ti) => { t.id = c.id + '-t' + ti; t.ids = t.items.map((_, ii) => t.id + '-' + ii); });
  }));

  // ---------- Storage ----------
  const KEY = 'fe-roadmap-v1';
  let done = {};
  try { done = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) { done = {}; }
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(done)); } catch (e) {} };

  const allIds = l => {
    const ids = [];
    l.cats.forEach(c => c.topics.forEach(t => ids.push(...t.ids)));
    l.projects.forEach((_, i) => ids.push(l.id + '-p' + i));
    return ids;
  };
  const count = ids => ids.filter(id => done[id]).length;
  const pct = ids => ids.length ? Math.round(count(ids) / ids.length * 100) : 0;

  // ---------- State ----------
  const valid = ['junior', 'middle', 'senior'];
  let level = valid.includes(location.hash.slice(1)) ? location.hash.slice(1) : 'junior';
  let query = '', onlyLeft = false;

  const $ = id => document.getElementById(id);
  const esc = s => s.replace(/[&<>"]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]));
  const hl = s => {
    if (!query) return esc(s);
    const i = s.toLowerCase().indexOf(query);
    if (i < 0) return esc(s);
    return esc(s.slice(0, i)) + '<mark>' + esc(s.slice(i, i + query.length)) + '</mark>' + esc(s.slice(i + query.length));
  };

  // ---------- Ladder ----------
  function renderLadder() {
    $('ladder').innerHTML = levels.map(l => {
      const p = pct(allIds(l));
      return `<button class="rung" data-go="${l.id}" aria-current="${l.id === level}">
        <span class="name">${l.title}<span class="sub">${l.sub}</span></span>
        <span class="bar" aria-hidden="true"><i style="width:${p}%"></i></span>
        <span class="pct">${p}%</span></button>`;
    }).join('');
  }

  // ---------- Main ----------
  function renderMain() {
    const l = levels.find(x => x.id === level);
    document.body.dataset.level = level;
    let html = '', side = '', shown = 0;

    l.cats.forEach(c => {
      const catIds = c.topics.flatMap(t => t.ids);
      let topicsHtml = '';
      c.topics.forEach(t => {
        const topicHit = query && t.name.toLowerCase().includes(query);
        const items = t.items.map((txt, i) => ({ txt, id: t.ids[i] })).filter(it => {
          if (onlyLeft && done[it.id]) return false;
          if (query && !topicHit && !it.txt.toLowerCase().includes(query)) return false;
          return true;
        });
        if (!items.length) return;
        shown++;
        const d = count(t.ids), n = t.ids.length;
        topicsHtml += `<details class="topic${d === n ? ' done' : ''}" data-topic="${t.id}"${query ? ' open' : ''}>
          <summary><span class="t-title">${hl(t.name)}</span>
            <span class="t-meta"><span class="mini"><i style="width:${d / n * 100}%"></i></span>${d}/${n}</span></summary>
          <ul class="items">${items.map(it => `<li><label><input type="checkbox" data-id="${it.id}"${done[it.id] ? ' checked' : ''}><span>${hl(it.txt)}</span></label></li>`).join('')}</ul>
          <div class="t-actions"><button data-all="${t.id}">${d === n ? 'Belgilarni olib tashlash' : 'Hammasini belgilash'}</button></div>
        </details>`;
      });
      if (!topicsHtml) return;
      const cd = count(catIds);
      html += `<section class="cat" id="${c.id}"><div class="cat-head"><h2>${esc(c.name)}</h2><span>${cd} / ${catIds.length}</span></div>${topicsHtml}</section>`;
      side += `<a href="#${level}" data-jump="${c.id}" class="${cd === catIds.length ? 'full' : ''}">${esc(c.name)}<small>${pct(catIds)}%</small></a>`;
    });

    if (!query && !onlyLeft || (onlyLeft && !query)) {
      const pr = l.projects.map((p, i) => ({ p, id: l.id + '-p' + i }));
      html += `<section class="projects" id="${l.id}-projects"><h2>Yakuniy amaliy loyihalar</h2>
        <p>Darajani yopish uchun bu loyihalarni mustaqil ishlab chiqing.</p>
        <ol>${pr.map(x => `<li><label><input type="checkbox" data-id="${x.id}"${done[x.id] ? ' checked' : ''}><span>${esc(x.p)}</span></label></li>`).join('')}</ol></section>`;
      side += `<a href="#${level}" data-jump="${l.id}-projects">Loyihalar<small>${count(pr.map(x => x.id))}/${pr.length}</small></a>`;
    }

    if (!shown && query) html = `<p class="empty">“${esc(query)}” bo‘yicha mavzu topilmadi. Boshqa so‘z bilan qidiring yoki boshqa darajaga o‘ting.</p>`;
    else if (!shown && onlyLeft) html = `<p class="empty">Bu darajada qolgan mavzu yo‘q — barchasi belgilangan.</p>` + html;

    $('main').innerHTML = html;
    $('side').innerHTML = side;

    const tot = allIds(l);
    $('totalStat').textContent = `${l.title}: ${count(tot)} / ${tot.length} band bajarildi`;
    $('toggleAll').textContent = 'Hammasini ochish';
  }

  function renderAll() { renderLadder(); renderMain(); }

  // ---------- Events ----------
  $('ladder').addEventListener('click', e => {
    const b = e.target.closest('[data-go]'); if (!b) return;
    level = b.dataset.go; history.replaceState(null, '', '#' + level);
    renderAll(); $('main').scrollIntoView({ block: 'start' });
  });

  $('main').addEventListener('change', e => {
    const cb = e.target.closest('input[data-id]'); if (!cb) return;
    if (cb.checked) done[cb.dataset.id] = 1; else delete done[cb.dataset.id];
    save();
    const open = [...document.querySelectorAll('details.topic[open]')].map(d => d.dataset.topic);
    renderAll();
    open.forEach(id => { const d = document.querySelector(`[data-topic="${id}"]`); if (d) d.open = true; });
  });

  $('main').addEventListener('click', e => {
    const b = e.target.closest('[data-all]'); if (!b) return;
    const l = levels.find(x => x.id === level);
    let t; l.cats.forEach(c => c.topics.forEach(x => { if (x.id === b.dataset.all) t = x; }));
    const all = t.ids.every(id => done[id]);
    t.ids.forEach(id => { if (all) delete done[id]; else done[id] = 1; });
    save(); renderAll();
    const d = document.querySelector(`[data-topic="${t.id}"]`); if (d) d.open = true;
  });

  $('side').addEventListener('click', e => {
    const a = e.target.closest('[data-jump]'); if (!a) return;
    e.preventDefault();
    const el = $(a.dataset.jump); if (el) el.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
  });

  let t0;
  $('q').addEventListener('input', e => {
    clearTimeout(t0);
    t0 = setTimeout(() => { query = e.target.value.trim().toLowerCase(); renderMain(); }, 150);
  });

  $('onlyLeft').addEventListener('click', e => {
    onlyLeft = !onlyLeft; e.currentTarget.setAttribute('aria-pressed', onlyLeft); renderMain();
  });

  $('toggleAll').addEventListener('click', e => {
    const ds = [...document.querySelectorAll('details.topic')];
    const openAll = ds.some(d => !d.open);
    ds.forEach(d => d.open = openAll);
    e.currentTarget.textContent = openAll ? 'Hammasini yopish' : 'Hammasini ochish';
  });

  $('reset').addEventListener('click', () => {
    const l = levels.find(x => x.id === level);
    if (!confirm(`${l.title} darajasidagi barcha belgilar o‘chiriladi. Davom etasizmi?`)) return;
    allIds(l).forEach(id => delete done[id]); save(); renderAll();
  });

  // Theme
  const root = document.documentElement;
  try { const th = localStorage.getItem(KEY + '-theme'); if (th) root.dataset.theme = th; } catch (e) {}
  $('theme').addEventListener('click', () => {
    const cur = root.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    root.dataset.theme = cur === 'dark' ? 'light' : 'dark';
    try { localStorage.setItem(KEY + '-theme', root.dataset.theme); } catch (e) {}
  });

  window.addEventListener('hashchange', () => {
    const h = location.hash.slice(1);
    if (valid.includes(h) && h !== level) { level = h; renderAll(); }
  });

  renderAll();
})();
</script>
